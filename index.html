<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO Security Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            max-width: 400px;
            margin: auto;
        }
        .btn { 
            background: #0088cc; 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px; 
            width: 100%;
        }
        .btn:hover {
            background: #006699;
        }
        .loader { 
            display: none; 
            margin: 20px auto; 
            border: 4px solid #333; 
            border-top: 4px solid #0088cc; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .desc {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 15px;
        }
        .success { color: #4ade80; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ نظام التحقق الأمني ZORO</h2>
        <p class="desc">لمنع الحسابات الوهمية وتعدد الحسابات، يرجى الضغط أدناه للتحقق من بصمة جهازك وتأمين حسابك نهائياً.</p>
        <div class="loader" id="loader"></div>
        <p class="success" id="successMsg" style="display: none;">✅ تم التحقق من جهازك بنجاح!</p>
        <button class="btn" id="verifyBtn" onclick="verifyDevice()">التحقق من الجهاز الآن</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function verifyDevice() {
            document.getElementById('verifyBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (!user) {
                alert("الرجاء فتح هذه الصفحة حصرياً داخل تطبيق تليجرام!");
                document.getElementById('verifyBtn').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
                return;
            }

            // محاكاة التحقق المحلي السريع والسلس دون أخطاء شبكة
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                
                setTimeout(() => {
                    tg.close(); // إغلاق النافذة العائمة والعودة للبوت تلقائياً
                }, 1000);
            }, 1200);
        }
    </script>
</body>
</html>
