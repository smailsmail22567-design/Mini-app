<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b1118;
      color: #ffffff;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      color: #4c8bf5;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .status-text {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 35px;
    }

    .status-text.failed {
      color: #ef4444;
    }

    .user-box {
      background: #131c29;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 45px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 310px;
    }

    .btn-action {
      width: 100%;
      max-width: 310px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: opacity 0.2s, background-color 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action.blocked {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .error-desc {
      font-size: 13px;
      color: #f87171;
      margin-top: -20px;
      margin-bottom: 30px;
      line-height: 1.5;
      display: none;
      max-width: 290px;
    }
  </style>
</head>
<body>

  <div class="title">Device<br>Verification</div>

  <div class="status-text" id="statusMessage">Verifying Device...</div>

  <div class="error-desc" id="errorDescription">
    Multiple accounts detected on this device. Only the primary registered account is authorized.
  </div>

  <div class="user-box" id="userBox">User ID: Loading...</div>

  <button class="btn-action" id="actionBtn" onclick="handleButtonClick()">Checking...</button>

  <script>
    const ADMIN_USER_ID = "7300916931";
    let currentUserId = null;
    let isDeviceAllowed = false;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
      if (tg.initDataUnsafe?.user?.id) {
        currentUserId = String(tg.initDataUnsafe.user.id);
      }
    }

    if (!currentUserId) {
      currentUserId = localStorage.getItem("dev_uid") || "user_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("dev_uid", currentUserId);
    }

    document.getElementById("userBox").innerText = "User ID: " + currentUserId;

    function generateDeviceFingerprint() {
      let hash = 0;
      try {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 200;
        canvas.height = 40;
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60";
        ctx.fillRect(100, 1, 62, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("MiiNi-HW-Verify", 2, 15);
        const dataUrl = canvas.toDataURL();
        for (let i = 0; i < dataUrl.length; i++) {
          hash = ((hash << 5) - hash) + dataUrl.charCodeAt(i);
          hash |= 0;
        }
      } catch (e) {}

      const screenSig = screen.width + "x" + screen.height + "x" + screen.colorDepth;
      const coreSig = (navigator.hardwareConcurrency || 4) + "_" + (navigator.maxTouchPoints || 1);
      return "hw_" + Math.abs(hash).toString(36) + "_" + screenSig + "_" + coreSig;
    }

    async function verifyDeviceIntegrity() {
      if (String(currentUserId) === String(ADMIN_USER_ID)) {
        displaySuccess();
        return;
      }

      const fp = generateDeviceFingerprint();
      const localDeviceOwnerKey = "owner_" + fp;
      const localRegisteredUser = localStorage.getItem(localDeviceOwnerKey);

      if (localRegisteredUser && String(localRegisteredUser) !== String(currentUserId)) {
        displayBlock();
        return;
      }

      if (!localRegisteredUser) {
        localStorage.setItem(localDeviceOwnerKey, String(currentUserId));
      }

      const cloudUrl = "https://kvdb.io/4y9K3s5K2g5j6H7p9L1/device_lock_" + fp;
      try {
        const res = await fetch(cloudUrl + "?nocache=" + Date.now());
        if (res.status === 404) {
          await fetch(cloudUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: String(currentUserId)
          });
          displaySuccess();
        } else if (res.ok) {
          const registeredOwner = (await res.text()).trim();
          if (registeredOwner && String(registeredOwner) !== String(currentUserId)) {
            displayBlock();
          } else {
            displaySuccess();
          }
        } else {
          displaySuccess();
        }
      } catch (e) {
        if (localRegisteredUser && String(localRegisteredUser) !== String(currentUserId)) {
          displayBlock();
        } else {
          displaySuccess();
        }
      }
    }

    function displaySuccess() {
      isDeviceAllowed = true;
      const statusEl = document.getElementById("statusMessage");
      const btnEl = document.getElementById("actionBtn");

      statusEl.className = "status-text";
      statusEl.innerText = "Verification Successful!";
      btnEl.className = "btn-action";
      btnEl.innerText = "Return to Bot";
    }

    function displayBlock() {
      isDeviceAllowed = false;
      const statusEl = document.getElementById("statusMessage");
      const btnEl = document.getElementById("actionBtn");
      const errDesc = document.getElementById("errorDescription");

      statusEl.className = "status-text failed";
      statusEl.innerText = "Verification Failed!";
      errDesc.style.display = "block";
      btnEl.className = "btn-action blocked";
      btnEl.innerText = "Device Blocked";
    }

    function handleButtonClick() {
      if (!isDeviceAllowed) {
        alert("⛔ هذا الجهاز مقفل بحساب آخر مسجل مسبقاً.");
        return;
      }

      if (tg) {
        tg.sendData(JSON.stringify({
          action: "device_verified",
          userId: currentUserId,
          status: "SUCCESS"
        }));
        tg.close();
      } else {
        alert("Verification completed successfully!");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      verifyDeviceIntegrity();
    });
  </script>
</body>
</html>
