<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق الأمني</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 100%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>جاري تأكيد الأمان...</h2>
        <div class="spinner"></div>
        <p id="status">جاري التحقق من بصمة الجهاز بنجاح.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // إغلاق نافذة التحقق تلقائياً بعد ثانية ونصف والعودة للبوت
        setTimeout(() => {
            document.getElementById('status').innerText = "✅ تم التحقق بنجاح!";
            setTimeout(() => {
                tg.close();
            }, 1000);
        }, 1500);
    </script>
</body>
</html>
