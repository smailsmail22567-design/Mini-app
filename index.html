<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق الربح</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --card-2: #3a3a3c;
    --text: #ffffff;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --gold-1: #ffd700;
    --gold-2: #b8860b;
    --green: #30d158;
    --red: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 380px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    margin-bottom: 14px; text-align: center;
  }
  .title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  #balance { font-size: 34px; font-weight: 800; letter-spacing: .5px; }

  #coin {
    display: block; margin: 8px auto 14px;
    width: 190px; height: 190px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--gold-1), var(--gold-2));
    box-shadow: 0 12px 32px rgba(255, 215, 0, .28);
    font-size: 72px; user-select: none;
    transition: transform .08s ease;
  }
  #coin:active:not(:disabled) { transform: scale(.94); }
  #coin:disabled { opacity: .8; cursor: default; }

  .energy-bar {
    width: 100%; height: 12px; background: var(--card-2);
    border-radius: 999px; overflow: hidden; margin-top: 8px;
  }
  #energyFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--green), #34c759);
    transition: width .3s ease;
  }
  #energyText { font-size: 14px; color: var(--muted); }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 11px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
    width: 100%;
  }
  .btn:disabled { background: #555; cursor: default; }
  .btn.small { width: auto; padding: 8px 14px; font-size: 14px; }

  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; text-align: right; }
  .muted { color: var(--muted); font-size: 13px; }

  .task {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--card-2);
  }
  .task:last-child { border-bottom: none; }
  .task-name { text-align: right; font-size: 15px; }
  .task-reward { color: var(--gold-1); font-size: 13px; }

  .ref-link {
    font-size: 12px; color: var(--muted); word-break: break-all;
    background: var(--card-2); border-radius: 10px; padding: 10px;
    margin: 10px 0; direction: ltr; text-align: left;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

  #status {
    min-height: 22px; font-size: 14px; color: var(--muted);
    text-align: center; margin-top: 4px;
  }

  .float {
    position: fixed; pointer-events: none; font-weight: 800; font-size: 22px;
    color: var(--gold-1); animation: rise .7s ease-out forwards; z-index: 10;
  }
  @keyframes rise {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-70px); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="title">رصيدك</div>
    <div id="balance">🪙 0</div>
  </div>

  <button id="coin" aria-label="اضغط للربح">🪙</button>

  <div class="card">
    <div id="energyText">⚡ الطاقة: --</div>
    <div class="energy-bar"><div id="energyFill"></div></div>
  </div>

  <div class="card">
    <div class="section-title">🎁 تسجيل الدخول اليومي</div>
    <button id="checkin" class="btn" disabled>جارٍ التحميل...</button>
    <div id="streak" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 المهام</div>
    <div id="tasks"><div class="muted">جارٍ التحميل...</div></div>
  </div>

  <div class="card">
    <div class="section-title">👥 الإحالات</div>
    <div class="muted">شارك رابطك، وتُحسب الإحالة بعد أن يلعب صديقك 10 ضغطات.</div>
    <div id="refLink" class="ref-link">--</div>
    <button id="copy" class="btn">نسخ الرابط</button>
    <div class="row">
      <span class="muted">الإحالات المفعّلة</span>
      <b id="refs">0</b>
    </div>
  </div>

  <div id="status"></div>
</div>

<script>
  // اتركه فارغاً إذا كانت الصفحة تُفتح من نفس خادم البوت.
  // إذا استضفت الصفحة على مكان آخر (مثل GitHub Pages) ضع هنا رابط الخادم.
  const API_BASE = "";

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const initData = tg?.initData || "";
  const $ = (id) => document.getElementById(id);

  const coin = $("coin");
  let busy = false;
  let maxEnergy = 100;
  let refLink = "";

  const MESSAGES = {
    no_energy: "نفدت الطاقة، انتظر قليلاً",
    banned: "الحساب محظور",
    under_review: "الحساب قيد المراجعة",
    not_registered: "أرسل /start للبوت أولاً",
    auth: "أعد فتح التطبيق من البوت",
    already_checked: "سجلت دخولك اليوم بالفعل",
    not_joined: "لم تنضم للقناة بعد",
    already_done: "أنجزت هذه المهمة من قبل",
    check_failed: "تعذر التحقق، حاول لاحقاً",
    task_not_found: "المهمة غير متاحة",
    bad_request: "طلب غير صالح",
  };

  function say(text) { $("status").textContent = text || ""; }

  function notify(text) {
    if (!text) return;
    if (tg?.showAlert) tg.showAlert(text);
    else say(text);
  }

  async function call(path, body) {
    const options = body === undefined
      ? { headers: { "X-Init-Data": initData } }
      : {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...body, initData }),
        };
    const res = await fetch(API_BASE + path, options);
    return res.json();
  }

  function renderEnergy(energy) {
    const pct = Math.max(0, Math.min(100, (energy / maxEnergy) * 100));
    $("energyFill").style.width = pct + "%";
    $("energyText").textContent = `⚡ الطاقة: ${energy} / ${maxEnergy}`;
  }

  function renderMe(d) {
    maxEnergy = d.max_energy;
    $("balance").textContent = "🪙 " + d.balance;
    renderEnergy(d.energy);
    $("streak").textContent = `سلسلة الأيام: ${d.streak}`;
    $("checkin").disabled = d.checked_today;
    $("checkin").textContent = d.checked_today ? "✅ سجلت اليوم" : "تسجيل الدخول اليومي";
    refLink = d.ref_link;
    $("refLink").textContent = refLink;
    $("refs").textContent = d.referrals;
  }

  async function loadMe() {
    try {
      const d = await call("/api/me");
      if (d.ok) { renderMe(d); say(""); }
      else say(MESSAGES[d.reason] || "تعذر تحميل البيانات");
    } catch {
      say("تعذر الاتصال بالخادم");
    }
  }

  async function loadTasks() {
    const box = $("tasks");
    try {
      const d = await call("/api/tasks");
      box.innerHTML = "";
      if (!d.ok) { box.textContent = MESSAGES[d.reason] || "تعذر تحميل المهام"; return; }
      if (!d.tasks.length) {
        box.innerHTML = '<div class="muted">لا توجد مهام الآن</div>';
        return;
      }
      for (const t of d.tasks) {
        const row = document.createElement("div");
        row.className = "task";

        const info = document.createElement("div");
        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = t.title;
        const reward = document.createElement("div");
        reward.className = "task-reward";
        reward.textContent = `+${t.reward} 🪙`;
        info.append(name, reward);

        const btn = document.createElement("button");
        btn.className = "btn small";
        btn.textContent = t.done ? "✅" : "تحقق";
        btn.disabled = t.done;
        btn.onclick = () => completeTask(t.id);

        row.append(info, btn);
        box.append(row);
      }
    } catch {
      box.textContent = "تعذر الاتصال بالخادم";
    }
  }

  async function completeTask(id) {
    const d = await call("/api/task", { task_id: id });
    if (d.ok) {
      say(`🎉 حصلت على +${d.reward}`);
      await Promise.all([loadMe(), loadTasks()]);
    } else {
      notify(MESSAGES[d.reason] || "حدث خطأ");
    }
  }

  function floatText() {
    const rect = coin.getBoundingClientRect();
    const el = document.createElement("div");
    el.className = "float";
    el.textContent = "+1";
    el.style.left = rect.left + rect.width / 2 - 10 + "px";
    el.style.top = rect.top + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  coin.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    coin.disabled = true;
    floatText();
    try {
      const d = await call("/api/tap", {});
      if (d.ok) {
        $("balance").textContent = "🪙 " + d.balance;
        renderEnergy(d.energy);
        tg?.HapticFeedback?.impactOccurred("light");
        say("");
      } else if (d.reason !== "too_fast") {
        notify(MESSAGES[d.reason] || "حدث خطأ");
      }
    } catch {
      say("تعذر الاتصال بالخادم");
    } finally {
      busy = false;
      coin.disabled = false;
    }
  });

  $("checkin").addEventListener("click", async () => {
    const btn = $("checkin");
    btn.disabled = true;
    try {
      const d = await call("/api/checkin", {});
      if (d.ok) {
        say(`🎁 +${d.reward} | سلسلة: ${d.streak}`);
        await loadMe();
      } else {
        notify(MESSAGES[d.reason] || "حدث خطأ");
        btn.disabled = false;
      }
    } catch {
      say("تعذر الاتصال بالخادم");
      btn.disabled = false;
    }
  });

  $("copy").addEventListener("click", async () => {
    if (!refLink) return;
    try {
      await navigator.clipboard.writeText(refLink);
      say("تم نسخ الرابط");
    } catch {
      say(refLink);
    }
  });

  loadMe();
  loadTasks();
</script>
</body>
</html>
