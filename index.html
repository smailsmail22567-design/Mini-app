<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التحقق الأمني من الجهاز</title>
    <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
    <style>
        body { font-family: Tahoma; background: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <h2>جاري التحقق من أمان الجهاز...</h2>
    <p id="msg">يرجى الانتظار قليلاً.</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const userId = tg.initDataUnsafe?.user?.id;

        if (!userId) {
            document.getElementById('msg').innerText = "❌ يفتح من داخل تيليجرام فقط.";
        } else {
            FingerprintJS.load().then(fp => {
                fp.get().then(result => {
                    const visitorId = result.visitorId; // بصمة الجهاز الفريدة
                    
                    // فحص الذاكرة المحلية للمتصفح (Local Storage) لمنع تعدد الحسابات على نفس المتصفح/الجهاز
                    const savedUser = localStorage.getItem('device_fingerprint');

                    if (savedUser && savedUser !== String(userId)) {
                        document.getElementById('msg').innerText = "⚠️ تنبيه: هذا الجهاز مسجل مسبقاً بحساب تيليجرام آخر ولا يمكن استخدام حساب متعدد!";
                    } else {
                        localStorage.setItem('device_fingerprint', userId);
                        document.getElementById('msg').innerText = "✅ تم التحقق من الجهاز بنجاح!";
                        setTimeout(() => {
                            tg.close(); // إغلاق النافذة والعودة للبوت
                        }, 1200);
                    }
                });
            });
        }
    </script>
</body>
</html>
