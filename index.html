<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق الربح الاحترافي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1015;
    --card: #181922;
    --text: #ffffff;
    --muted: #94a3b8;
    --accent: #2563eb;
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    --gold: #f59e0b;
    --gold-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    --red: #ef4444;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 80px);
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 420px; }
  .hidden { display: none !important; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  
  .balance-card { text-align: center; position: relative; overflow: hidden; }
  .title { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  #balance { font-size: 38px; font-weight: 800; letter-spacing: .5px; background: linear-gradient(to right, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .coin-container { display: flex; flex-direction: column; align-items: center; margin: 24px 0; }
  #coin {
    width: 200px; height: 200px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--gold-gradient);
    box-shadow: 0 15px 35px rgba(245, 158, 11, 0.3), inset 0 2px 6px rgba(255,255,255,0.4);
    font-size: 80px; user-select: none; display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s ease;
  }
  #coin:active { transform: scale(0.92); }

  .energy-container { width: 100%; margin-top: 12px; }
  .energy-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .energy-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 999px; overflow: hidden; }
  #energyFill { height: 100%; width: 100%; background: var(--accent-gradient); border-radius: 999px; transition: width 0.3s ease; }

  .btn {
    background: var(--accent-gradient); color: #fff; border: none; border-radius: 14px;
    padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .btn.admin-btn { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
  
  .task {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .task-info { text-align: right; flex: 1; }
  .task-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .task-reward { color: var(--gold); font-size: 12px; font-weight: 500; }

  .ref-box {
    background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin: 12px 0; font-size: 12px; color: var(--muted);
    word-break: break-all; direction: ltr; text-align: left;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

  /* شريط التنقل السفلي */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(24, 25, 34, 0.95); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); display: flex; flex-direction: row-reverse;
    justify-content: space-around; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 100;
  }
  .nav-item {
    background: none; border: none; color: var(--muted); font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    flex: 1; transition: color 0.2s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item span.icon { font-size: 20px; }

  .form-group { margin-bottom: 12px; text-align: right; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .input-field {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; color: #fff; font-size: 14px;
  }

  .float {
    position: fixed; pointer-events: none; font-weight: 800; font-size: 24px;
    color: var(--gold); animation: rise 0.8s ease-out forwards; z-index: 1000;
  }
  @keyframes rise {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-80px) scale(1.2); }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- تبويب الرئيسية -->
  <div id="tab-home" class="tab-content">
    <div class="card balance-card">
      <div class="title">إجمالي الرصيد</div>
      <div id="balance">🪙 0</div>
    </div>
    <div class="coin-container">
      <button id="coin" aria-label="اضغط للربح">🪙</button>
      <div class="energy-container">
        <div class="energy-info">
          <span id="energyText">⚡ الطاقة: 100 / 100</span>
          <span>تعبئة تلقائية</span>
        </div>
        <div class="energy-bar"><div id="energyFill"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">🎁 تسجيل الدخول اليومي</div>
      <button id="checkin" class="btn">تسجيل الحضور اليومي</button>
      <div id="streak" class="muted" style="margin-top:8px; text-align: center;">سلسلة الأيام: 1 🔥</div>
    </div>
  </div>

  <!-- تبويب المهام -->
  <div id="tab-tasks" class="tab-content hidden">
    <div class="card">
      <div class="section-title">📋 المهام المتاحة</div>
      <div id="tasksList">
        <div class="task">
          <div class="task-info">
            <div class="task-name">انضم لقناة البوت الرسمية</div>
            <div class="task-reward">+500 🪙</div>
          </div>
          <button class="btn small" onclick="alert('تم إنجاز المهمة بنجاح!')">تحقق</button>
        </div>
      </div>
    </div>
  </div>

  <!-- تبويب الأصدقاء -->
  <div id="tab-frens" class="tab-content hidden">
    <div class="card">
      <div class="section-title">👥 دعوة الأصدقاء</div>
      <div class="muted">شارك رابطك واحصل على مكافأة عن كل صديق.</div>
      <div class="ref-box" id="myRefLink">https://t.me/Bot?start=ref7300916931</div>
      <button class="btn" onclick="navigator.clipboard.writeText('https://t.me/Bot?start=ref7300916931'); alert('تم نسخ الرابط!');">نسخ الرابط</button>
      <div class="row">
        <span class="muted">الإحالات المفعّلة</span>
        <b>0</b>
      </div>
    </div>
  </div>

  <!-- تبويب الأدمن (ظاهر مباشرة للمالك) -->
  <div id="tab-admin" class="tab-content hidden">
    <div class="card" style="border-color: rgba(239, 68, 68, 0.4);">
      <div class="section-title" style="color: var(--red);">⚙️ لوحة تحكم المشرف (ID: 7300916931)</div>
      <div class="form-group">
        <label>عنوان المهمة الجديدة</label>
        <input type="text" id="newTitle" class="input-field" placeholder="مثال: اشترك في القناة">
      </div>
      <div class="form-group">
        <label>مكافأة النقاط</label>
        <input type="number" id="newReward" class="input-field" placeholder="100">
      </div>
      <button class="btn admin-btn" onclick="addNewTask()">إضافة المهمة للنظام</button>
    </div>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<nav class="nav-bar">
  <button class="nav-item" onclick="switchTab('admin', this)">
    <span class="icon">⚙️</span>
    <span>الأدمن</span>
  </button>
  <button class="nav-item" onclick="switchTab('frens', this)">
    <span class="icon">👥</span>
    <span>الأصدقاء</span>
  </button>
  <button class="nav-item" onclick="switchTab('tasks', this)">
    <span class="icon">📋</span>
    <span>المهام</span>
  </button>
  <button class="nav-item active" onclick="switchTab('home', this)">
    <span class="icon">🏠</span>
    <span>الرئيسية</span>
  </button>
</nav>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    el.classList.add('active');
  }

  let balance = 0;
  let energy = 100;
  const coin = document.getElementById('coin');
  
  coin.addEventListener("click", (e) => {
    if (energy > 0) {
      balance += 1;
      energy -= 1;
      document.getElementById('balance').textContent = "🪙 " + balance;
      document.getElementById('energyText').textContent = `⚡ الطاقة: ${energy} / 100`;
      document.getElementById('energyFill').style.width = energy + "%";
      tg?.HapticFeedback?.impactOccurred("light");
    }
  });

  function addNewTask() {
    const title = document.getElementById('newTitle').value;
    const reward = document.getElementById('newReward').value;
    if(!title || !reward) { alert('الرجاء تعبئة الحقول'); return; }
    
    const list = document.getElementById('tasksList');
    list.innerHTML += `
      <div class="task">
        <div class="task-info">
          <div class="task-name">${title}</div>
          <div class="task-reward">+${reward} 🪙</div>
        </div>
        <button class="btn small" onclick="alert('تم إنجاز المهمة!')">تحقق</button>
      </div>
    `;
    alert('تمت إضافة المهمة بنجاح!');
    document.getElementById('newTitle').value = '';
    document.getElementById('newReward').value = '';
  }
</script>
</body>
</html>
